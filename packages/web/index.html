<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PocketRocket</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- P9: installable PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f8f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PocketRocket" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        var f = localStorage.getItem('pocketrocket.font');
        if (f) document.documentElement.dataset.font = f;
        var t = localStorage.getItem('pocketrocket.theme');
        // A stored 'system' means the same as nothing stored: follow the OS.
        if (t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
