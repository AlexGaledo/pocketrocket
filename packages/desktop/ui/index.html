<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PocketRocket</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; background: #f7f7f8; color: #111214; font: 14px/1.5 "Geist", "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) { html, body { background: #0b0c0f; color: #f2f3f5; } .card { background: #15171b; } .status, input, select { background: #1f2228 !important; color: #f2f3f5; } .muted, .dim { color: #9aa3ae; } button { background: #1f2228; color: #f2f3f5; } button.primary { background: #f2f3f5; color: #0b0c0f; } }
  .wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  .card { width: 440px; padding: 28px; border-radius: 24px; background: #fff; box-shadow: 0 2px 4px rgba(17,18,20,.06), 0 24px 48px rgba(17,18,20,.12); }
  h1 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em; }
  .mark { width: 28px; height: 28px; border-radius: 50%; background: #111214; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .muted { color: #6e7681; font-size: 13px; } .dim { color: #a0a7b1; font-size: 12px; }
  .status { margin: 18px 0; padding: 12px 14px; border-radius: 14px; background: #f0f1f3; min-height: 44px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: #e8842f; animation: blink 1s ease-in-out infinite; }
  .dot.ok { background: #1f9d6a; animation: none; } .dot.bad { background: #de4747; animation: none; }
  @keyframes blink { 50% { opacity: .3; } }
  .err { color: #de4747; font-size: 12.5px; white-space: pre-wrap; margin-top: 8px; }
  label { display: block; font-size: 12.5px; font-weight: 500; margin: 12px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; height: 36px; padding: 0 12px; border-radius: 12px; border: 0; background: #f0f1f3; color: inherit; font-size: 14px; font-family: inherit; }
  input:focus, select:focus { outline: 2px solid rgba(79,125,243,.5); }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .btns { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  button { height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: #f0f1f3; color: #111214; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; }
  button.primary { background: #111214; color: #fff; }
  button:hover { filter: brightness(.96); }
  details { margin-top: 14px; } summary { cursor: pointer; color: #6e7681; font-size: 12.5px; }
  code { font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1><span class="mark">⚡</span> PocketRocket</h1>
    <div class="muted" id="sub">Starting</div>
    <div class="status"><span class="dot" id="dot"></span><span id="msg">Starting</span><div class="err" id="err" hidden></div></div>
    <details id="settings">
      <summary>Connection settings</summary>
      <label>Where the bots run</label>
      <select id="mode">
        <option value="local">This PC. Own database in the app folder, no network hop</option>
        <option value="remote">VPS over SSH tunnel. Always-on, with the virtual desktop</option>
        <option value="attach">Attach to a hub already running on this PC</option>
      </select>
      <div class="row">
        <div><label>SSH host (from ~/.ssh/config)</label><input id="host" placeholder="my-server" /></div>
        <div style="flex:0 0 110px"><label>Port</label><input id="port" type="number" value="7788" /></div>
      </div>
      <div class="dim" id="datadir" style="margin-top:10px"></div>
      <div class="btns"><button id="retry">Retry</button><button class="primary" id="save">Save and connect</button></div>
    </details>
  </div>
</div>
<script>
  const invoke = (cmd, args) => window.__TAURI__ ? window.__TAURI__.core.invoke(cmd, args) : Promise.reject(new Error('not in tauri'));
  const $ = (id) => document.getElementById(id);
  let cfg = null;
  const modeText = (c) => c.mode === 'remote' ? 'SSH tunnel to ' + c.sshHost + ', hub port ' + c.port : c.mode === 'local' ? 'Running on this PC, port ' + c.port : 'Attached to 127.0.0.1:' + c.port;
  async function loadCfg() {
    try { cfg = await invoke('get_config'); } catch { cfg = { mode: 'local', sshHost: '', port: 7788 }; }
    $('mode').value = cfg.mode; $('host').value = cfg.sshHost; $('port').value = cfg.port;
    $('sub').textContent = modeText(cfg);
  }
  async function poll() {
    try {
      const s = await invoke('get_status');
      const dot = $('dot');
      if (s.dataDir) $('datadir').innerHTML = 'Local data folder: <code>' + s.dataDir + '</code>';
      if (s.connected) { dot.className = 'dot ok'; $('msg').textContent = 'Connected, opening'; }
      else if (s.error) { dot.className = 'dot bad'; $('msg').textContent = 'Could not connect'; $('err').hidden = false; $('err').textContent = s.error; $('settings').open = true; }
      else { dot.className = 'dot'; $('msg').textContent = (s.mode === 'local' ? (s.childRunning ? 'Starting the hub' : 'Launching') : s.mode === 'remote' ? (s.childRunning ? 'Tunnel up, waiting for the hub' : 'Opening tunnel') : 'Looking for a hub') + ' · ' + s.attempts + 's'; $('err').hidden = true; }
    } catch (e) { $('msg').textContent = 'Not running inside the desktop app.'; }
  }
  $('save').onclick = async () => {
    const c = { mode: $('mode').value, sshHost: $('host').value.trim() || '', port: Number($('port').value) || 7788, hubDir: cfg && cfg.hubDir ? cfg.hubDir : null };
    await invoke('save_config', { config: c }); await loadCfg(); $('settings').open = false;
  };
  $('retry').onclick = () => invoke('retry');
  loadCfg(); poll(); setInterval(poll, 1000);
</script>
</body>
</html>
