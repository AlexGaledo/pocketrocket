<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PocketRocket</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --card2: #f0f1f3;
    --line: #e6e7ea;
    --fg: #111214;
    --muted: #6e7681;
    --dim: #a0a7b1;
    --accent: #4f7df3;
    --ok: #1f9d6a;
    --warn: #e8842f;
    --bad: #de4747;
    --ink: #111214;
    --ink-fg: #ffffff;
    --shadow-lg: 0 2px 4px rgba(17, 18, 20, .06), 0 24px 48px rgba(17, 18, 20, .12);
    --wash-a: rgba(79, 125, 243, .10);
    --wash-b: rgba(31, 157, 106, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0b0c0f;
      --panel: #15171b;
      --card2: #1f2228;
      --line: #262a31;
      --fg: #f2f3f5;
      --muted: #9aa3ae;
      --dim: #666d77;
      --accent: #7ea1ff;
      --ok: #38c48a;
      --warn: #f0954a;
      --bad: #f06060;
      --ink: #f2f3f5;
      --ink-fg: #0b0c0f;
      --shadow-lg: 0 2px 4px rgba(0, 0, 0, .5), 0 24px 48px rgba(0, 0, 0, .55);
      --wash-a: rgba(126, 161, 255, .10);
      --wash-b: rgba(56, 196, 138, .07);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--fg);
    font: 14px/1.5 "Geist", "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 500px at 8% -10%, var(--wash-a), transparent 60%),
      radial-gradient(800px 500px at 100% 110%, var(--wash-b), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .wrap { height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 460px; max-width: 100%; padding: 26px; border-radius: 24px; background: var(--panel); box-shadow: var(--shadow-lg); }

  /* ---- header ---- */
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .mark svg { display: block; width: 28px; height: 28px; border-radius: 50%; flex: none; }
  .head-text h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .status-line { margin-top: 3px; display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); min-height: 16px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--warn); animation: blink 1s ease-in-out infinite; }
  .dot.ok { background: var(--ok); animation: none; }
  .dot.bad { background: var(--bad); animation: none; }
  @keyframes blink { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

  /* ---- error panel ---- */
  .err-panel { margin: 0 0 16px; padding: 12px 14px; border-radius: 14px; background: color-mix(in oklab, var(--bad) 12%, var(--panel)); color: var(--bad); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
  .err-panel code { display: block; margin-top: 8px; padding: 5px 9px; border-radius: 8px; background: var(--card2); color: var(--fg); font-size: 11.5px; word-break: break-all; white-space: normal; font-family: "Geist Mono", ui-monospace, Consolas, monospace; }

  /* ---- section ---- */
  .section-title { font-size: 12.5px; font-weight: 600; color: var(--fg); margin: 0 0 8px; }
  .radios { display: flex; flex-direction: column; gap: 8px; }

  .mode-card { position: relative; cursor: pointer; border-radius: 16px; padding: 12px 14px; background: var(--card2); box-shadow: inset 0 0 0 1px var(--line); transition: background .15s ease, box-shadow .15s ease; }
  .mode-card:hover { background: color-mix(in oklab, var(--card2), var(--fg) 4%); }
  .mode-card.selected { background: color-mix(in oklab, var(--accent) 9%, var(--panel)); box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--accent) 55%, transparent); }
  .mode-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mode-title { font-size: 13.5px; font-weight: 600; }
  .mode-indicator { display: flex; align-items: center; gap: 6px; min-height: 18px; flex: none; }
  .mode-blurb { margin-top: 3px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .mode-blurb code { font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-size: 11.5px; background: color-mix(in oklab, var(--card2), var(--fg) 6%); padding: 1px 4px; border-radius: 5px; }

  .check-badge { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--ink-fg); font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center; flex: none; }
  .pill-active { font-size: 10.5px; font-weight: 600; color: var(--fg); background: var(--panel); padding: 2.5px 8px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); }
  .ring-badge { width: 15px; height: 15px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--accent); flex: none; }

  /* ---- fields ---- */
  .fields { margin-top: 14px; }
  label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 500; margin: 0 0 4px; }
  label .hint { font-weight: 400; color: var(--dim); font-size: 11.5px; }
  input { width: 100%; height: 36px; padding: 0 12px; border-radius: 12px; border: 0; background: var(--card2); color: inherit; font-size: 14px; font-family: inherit; }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field + .field { margin-top: 12px; }
  .info-line { margin-top: 10px; font-size: 12px; color: var(--dim); }
  .info-line code { font-family: "Geist Mono", ui-monospace, Consolas, monospace; word-break: break-all; }

  /* ---- buttons ---- */
  .btns { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
  .btn { height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--card2); color: var(--fg); cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; }
  .btn:hover { filter: brightness(.96); }
  .btn.primary { background: var(--ink); color: var(--ink-fg); }
  .btn:disabled { opacity: .4; cursor: default; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <header class="head">
      <span class="mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="28" height="28">
          <circle cx="512" cy="512" r="512" fill="#111214"/>
          <g transform="translate(512 512) rotate(45) translate(-512 -512)" fill="#FFFFFF">
            <path d="M512 176c96 0 168 128 168 336v168H344V512c0-208 72-336 168-336z"/>
            <path d="M344 560l-96 96v128l96-64zM680 560l96 96v128l-96-64z"/>
            <circle cx="512" cy="452" r="58" fill="#111214"/>
            <circle cx="512" cy="452" r="34" fill="#FFFFFF"/>
            <path d="M440 680h144l24 56H416z"/>
          </g>
          <circle cx="318" cy="742" r="46" fill="#FFFFFF" opacity="0.9"/>
          <circle cx="236" cy="808" r="30" fill="#FFFFFF" opacity="0.6"/>
        </svg>
      </span>
      <div class="head-text">
        <h1>PocketRocket</h1>
        <div class="status-line"><span class="dot" id="dot"></span><span id="status-text">Starting…</span></div>
      </div>
    </header>

    <div class="err-panel" id="err-panel" hidden><span id="err-text"></span></div>

    <section>
      <div class="section-title">Where your bots run</div>
      <div class="radios" role="radiogroup" aria-label="Where your bots run" id="mode-group">
        <div class="mode-card" role="radio" tabindex="0" data-mode="local" id="card-local">
          <div class="mode-top">
            <div class="mode-title">This PC</div>
            <div class="mode-indicator"></div>
          </div>
          <div class="mode-blurb">Own database in the app folder. No network hop.</div>
        </div>
        <div class="mode-card" role="radio" tabindex="-1" data-mode="remote" id="card-remote">
          <div class="mode-top">
            <div class="mode-title">Server over SSH</div>
            <div class="mode-indicator"></div>
          </div>
          <div class="mode-blurb">Always-on hub on a VPS, with the virtual desktop.</div>
        </div>
        <div class="mode-card" role="radio" tabindex="-1" data-mode="attach" id="card-attach">
          <div class="mode-top">
            <div class="mode-title">Attach to a running hub</div>
            <div class="mode-indicator"></div>
          </div>
          <div class="mode-blurb">A hub you started yourself with <code>pnpm start</code>.</div>
        </div>
      </div>
    </section>

    <section class="fields" id="fields-remote" hidden>
      <div class="field">
        <label for="host-input">SSH host <span class="hint">from ~/.ssh/config</span></label>
        <input id="host-input" placeholder="my-server" autocomplete="off" spellcheck="false" />
      </div>
    </section>

    <section class="fields">
      <div class="field">
        <label for="port-input">Port</label>
        <input id="port-input" type="number" value="7788" />
      </div>
    </section>

    <div class="info-line" id="datadir-line" hidden>Data folder: <code id="datadir-value"></code></div>
    <div class="info-line" id="hubdir-line" hidden>Hub dir override: <code id="hubdir-value"></code></div>

    <div class="btns">
      <button class="btn" id="retry">Retry</button>
      <button class="btn primary" id="save" disabled>Save and connect</button>
    </div>
  </div>
</div>
<script>
  const invoke = (cmd, args) => window.__TAURI__ ? window.__TAURI__.core.invoke(cmd, args) : Promise.reject(new Error('not in tauri'));
  const $ = (id) => document.getElementById(id);
  const MODES = ['local', 'remote', 'attach'];
  const cards = { local: $('card-local'), remote: $('card-remote'), attach: $('card-attach') };

  let cfg = { mode: 'local', sshHost: '', port: 7788, hubDir: null };
  let selectedMode = cfg.mode;
  let lastStatus = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function isDirty() {
    if (selectedMode !== cfg.mode) return true;
    if (selectedMode === 'remote' && $('host-input').value.trim() !== (cfg.sshHost || '')) return true;
    const port = Number($('port-input').value) || 0;
    if (port !== cfg.port) return true;
    return false;
  }

  function renderIndicator(mode) {
    const slot = cards[mode].querySelector('.mode-indicator');
    if (mode === cfg.mode) {
      slot.innerHTML = '<span class="check-badge">✓</span><span class="pill-active">Active</span>';
    } else if (mode === selectedMode) {
      slot.innerHTML = '<span class="ring-badge"></span>';
    } else {
      slot.innerHTML = '';
    }
  }

  function render() {
    for (const mode of MODES) {
      const card = cards[mode];
      const selected = mode === selectedMode;
      card.classList.toggle('selected', selected);
      card.setAttribute('aria-checked', String(selected));
      card.tabIndex = selected ? 0 : -1;
      renderIndicator(mode);
    }
    $('fields-remote').hidden = selectedMode !== 'remote';
    $('datadir-line').hidden = !(selectedMode === 'local' && lastStatus && lastStatus.dataDir);
    if (lastStatus && lastStatus.dataDir) $('datadir-value').textContent = lastStatus.dataDir;
    $('hubdir-line').hidden = !cfg.hubDir;
    if (cfg.hubDir) $('hubdir-value').textContent = cfg.hubDir;
    $('save').disabled = !isDirty();
  }

  function selectMode(mode, focus) {
    selectedMode = mode;
    render();
    if (focus) cards[mode].focus();
  }

  for (const mode of MODES) {
    const card = cards[mode];
    card.addEventListener('click', () => selectMode(mode, false));
    card.addEventListener('keydown', (e) => {
      const idx = MODES.indexOf(mode);
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); selectMode(MODES[(idx + 1) % MODES.length], true); }
      else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); selectMode(MODES[(idx - 1 + MODES.length) % MODES.length], true); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectMode(mode, false); }
    });
  }
  $('host-input').addEventListener('input', render);
  $('port-input').addEventListener('input', render);

  async function loadCfg() {
    try { cfg = await invoke('get_config'); }
    catch { cfg = { mode: 'local', sshHost: '', port: 7788, hubDir: null }; }
    selectedMode = cfg.mode;
    $('host-input').value = cfg.sshHost || '';
    $('port-input').value = cfg.port || 7788;
    render();
  }

  function statusMessage(s) {
    if (s.connected) return 'Connected, opening';
    if (s.error) return 'Could not connect';
    const base = s.mode === 'local' ? (s.childRunning ? 'Starting the hub' : 'Launching')
      : s.mode === 'remote' ? (s.childRunning ? 'Tunnel up, waiting for the hub' : 'Opening tunnel')
      : 'Looking for a hub';
    return [base, s.runtime, s.attempts != null ? s.attempts + 's' : null].filter(Boolean).join(' · ');
  }

  async function poll() {
    try {
      const s = await invoke('get_status');
      lastStatus = s;
      const dot = $('dot');
      dot.className = 'dot' + (s.connected ? ' ok' : s.error ? ' bad' : '');
      $('status-text').textContent = statusMessage(s);
      if (s.error) {
        $('err-panel').hidden = false;
        let html = escapeHtml(s.error);
        if (s.mode === 'local' && s.logPath) html += '<code>' + escapeHtml(s.logPath) + '</code>';
        $('err-text').innerHTML = html;
      } else {
        $('err-panel').hidden = true;
      }
      render();
    } catch {
      $('dot').className = 'dot';
      $('status-text').textContent = 'Not running inside the desktop app.';
    }
  }

  $('save').onclick = async () => {
    const config = {
      mode: selectedMode,
      sshHost: $('host-input').value.trim(),
      port: Number($('port-input').value) || 7788,
      hubDir: cfg.hubDir || null,
    };
    $('save').disabled = true;
    try { await invoke('save_config', { config }); await loadCfg(); }
    finally { render(); }
  };
  $('retry').onclick = () => { invoke('retry').catch(() => {}); };

  loadCfg();
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
