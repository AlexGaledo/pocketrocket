[package]
name = "pocketrocket-desktop"
version = "0.5.0"
description = "PocketRocket desktop app"
edition = "2021"

[lib]
name = "pocketrocket_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# only for the per-launch hub token
getrandom = "0.4"
# hands links to the default browser; ShellExecuteExW on Windows, so no cmd.exe parsing of the URL
open = { version = "5", features = ["shellexecute-on-windows"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# local desktop notifications; the hub page reaches only the notify commands, see capabilities/hub-notify.json
# pinned: 2.4.x is the last line that accepts the tauri 2.11 this repo locks (2.5+ needs tauri 2.12, which moves webview2-com past what lib.rs uses)
tauri-plugin-notification = "=2.4.0"
# signed self-updates from GitHub Releases. Registered in Rust only: no capability grants updater:* and there is
# no #[tauri::command] for it, so the hub page cannot trigger a check or an install.
# pinned: 2.12.0 is the last version that accepts tauri 2.11 (2.13+ needs tauri ^2.12); bump together with tauri.
tauri-plugin-updater = "=2.12.0"
# ConPTY on Windows: the "Server terminal" window
portable-pty = "0.9"
# system clipboard for copy/paste in that window (the webview blocks its own clipboard API)
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
# the same version tauri uses, for catching Alt+Enter before the page sees it
webview2-com = "0.39"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }
