[package]
name = "pocketrocket-desktop"
version = "0.2.0"
description = "PocketRocket desktop app"
edition = "2021"

[lib]
name = "pocketrocket_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# only for the per-launch hub token
getrandom = "0.4"
# hands links to the default browser; ShellExecuteExW on Windows, so no cmd.exe parsing of the URL
open = { version = "5", features = ["shellexecute-on-windows"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
