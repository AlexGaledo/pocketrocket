name: Bug report
description: Something in PocketRocket isn't working right
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.

  - type: dropdown
    id: run-mode
    attributes:
      label: Local or server mode?
      options:
        - Local — Windows installer (desktop app)
        - Local — from source (pnpm dev)
        - Local — from source (pnpm build && pnpm start)
        - Server mode — VPS / systemd
        - Desktop app connected to a server-mode hub (SSH tunnel)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PocketRocket app version
      description: From Settings → About (desktop app), or the version in package.json / the installer filename
      placeholder: e.g. 0.2.0
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Only if running the desktop app or installer. Leave blank for a Linux/macOS server hub.
      placeholder: e.g. Windows 11 24H2
    validations:
      required: false

  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code CLI version
      description: Output of `claude --version`
      placeholder: e.g. 2.x.x
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Paste relevant lines from `hub.log` (desktop app: View menu → Open hub
        log, or the data folder; from source or VPS: the hub's stdout, or
        `journalctl -u pocketrocket`). Set `POCKETROCKET_DEBUG=1` for more
        detail. Redact anything sensitive.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
