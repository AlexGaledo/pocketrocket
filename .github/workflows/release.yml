name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build + release (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03 (moving branch, resolved via `commits/stable`)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version sync
        run: node scripts/version.mjs --check

      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Prepare desktop bundle (hub build + web build + Node sidecar)
        run: pnpm desktop:prepare

      - name: Extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const text = fs.readFileSync('CHANGELOG.md', 'utf8');
            const lines = text.split('\n');
            let start = -1, end = lines.length;
            for (let i = 0; i < lines.length; i++) {
              if (/^## \[/.test(lines[i])) { start = i; break; }
            }
            if (start >= 0) {
              for (let i = start + 1; i < lines.length; i++) {
                if (/^## \[/.test(lines[i])) { end = i; break; }
              }
            }
            const body = start >= 0 ? lines.slice(start + 1, end).join('\n').trim() : '';
            fs.writeFileSync(process.env.GITHUB_OUTPUT, 'body<<CHANGELOG_EOF\n' + (body || 'See CHANGELOG.md') + '\nCHANGELOG_EOF\n', { flag: 'a' });
          "

      - name: Build + publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tagName: v__VERSION__
          releaseName: 'PocketRocket v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Build only (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm --filter @pocketrocket/desktop build:app

      - name: Upload installer as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocketrocket-windows-installer
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
