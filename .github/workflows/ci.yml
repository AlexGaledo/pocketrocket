name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version sync
        run: node scripts/version.mjs --check

      - name: Build (typecheck + vite)
        run: pnpm -r build

      - name: Test
        run: pnpm test

  desktop-check:
    name: Desktop (cargo check)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-build validates that every externalBin sidecar and resources dir exists, even for `cargo check`,
      # so run the same prepare step the release uses (hub bundle + web + Node sidecar).
      - name: Prepare desktop resources
        run: pnpm desktop:prepare

      - name: cargo check
        run: cargo check --manifest-path packages/desktop/src-tauri/Cargo.toml
